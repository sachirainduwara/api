<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachiya API Store - Premium 150+ APIs</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);
        }
        @keyframes minimizeEffect {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.92); background-color: rgba(16, 185, 129, 0.2); border-color: #10b981; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-minimize {
            animation: minimizeEffect 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header Section -->
    <header class="w-full max-w-7xl mx-auto text-center my-6">
        <div class="inline-block p-2 px-4 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-sm font-medium mb-3">
            <i class="fa-solid fa-bolt mr-2"></i> Powered by Sachiya Tech | 150+ Active APIs
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
            Sachiya API Store
        </h1>
        <p class="text-slate-400 mt-2 max-w-xl mx-auto text-sm md:text-base">
            Explore 150+ Downloaders, AI, Search, Media & Tools API Services. Click to Generate & Save Permanent Keys!
        </p>
        
        <!-- Search Bar -->
        <div class="mt-6 max-w-md mx-auto relative">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search 150+ APIs (e.g., tiktok, gpt, search, anime)..." 
                class="w-full pl-11 pr-4 py-3 rounded-xl glass text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-500">
        </div>
    </header>

    <!-- Main Grid Container -->
    <main class="w-full max-w-7xl mx-auto my-4 flex-grow">
        <div id="apiGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-sm font-medium">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <span id="toastMsg">API Key Generated Successfully!</span>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-slate-500 text-xs py-6 mt-8 border-t border-slate-800">
        &copy; 2026 Sachiya API Store. All rights reserved.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Services 150+ (Downloaders, Tools, Search, AI, Media, etc.)
        const services = [
            // Downloaders
            "TikTok Downloader", "Instagram Downloader", "YouTube Video DL", "Facebook Downloader", "Twitter Video DL",
            "Pinterest Downloader", "Spotify Downloader", "SoundCloud DL", "MediaFire DL", "Mega.nz DL",
            "Vimeo Downloader", "Dailymotion DL", "Reddit Video DL", "Twitch Clip DL", "Snapchat Story DL",
            "Threads Video DL", "CapCut Template DL", "Likee Downloader", "ShareChat DL", "SnapTik Engine",
            
            // AI & Chatbots
            "OpenAI GPT-4o", "Claude 3.5 Sonnet", "Google Gemini Pro", "DeepSeek V3", "Mistral Large",
            "Llama 3.3 70B", "Groq Cloud API", "Perplexity Sonar", "Cohere Command", "HuggingFace API",
            "Midjourney Gen", "Stable Diffusion", "ElevenLabs TTS", "Whisper Audio", "Leonardo AI",
            "Runway Gen-2", "Suno Music API", "Udio Audio Gen", "Pika Labs API", "DeepFace Live",

            // Search & Web Scrapers
            "Google Search API", "Bing Search API", "DuckDuckGo API", "Wikipedia Search", "YouTube Search API",
            "GitHub User Search", "Reddit Post Scraper", "Medium Article DL", "Quora Q&A Scraper", "IMDb Movie Search",
            "TMDB Movie API", "Goodreads Books API", "Steam Game Search", "AppStore Search API", "PlayStore Search",
            "Torrent Search API", "Lyrics Finder API", "Anime Search API", "Manga Reader API", "Wallpaper Search",

            // Social Media Tools & Stalkers
            "TikTok Stalker", "Instagram Stalker", "GitHub Stalker", "TrueCaller Lookup", "IP Geolocation",
            "Domain WHOIS API", "SSL Checker API", "QR Code Generator", "ShortLink Generator", "Password Generator",
            "Base64 Encoder/Decoder", "JSON Formatter", "HTML to PDF", "Screenshot Capture", "EXIF Data Extractor",

            // Media & Editing Tools
            "Image Background Remove", "Image Upscaler HD", "Image Compressor", "Video to Audio Converter", "Audio Cutter API",
            "Watermark Remover", "OCR Text Extractor", "Barcode Scanner", "Color Palette Gen", "Meme Generator API",
            "Sticker Maker API", "GIF Search Giphy", "Unsplash HD Photos", "Pexels Video API", "Pixabay Media API",

            // Entertainment & Fun
            "Anime Quotes API", "Joke Generator API", "Fact Generator", "Riddle API", "Horoscope API",
            "Love Calculator", "Matrix Text Gen", "ASCII Art Generator", "Truth or Dare API", "Advice Slip API",

            // Developer & Cloud Tools
            "Temp Mail Generator", "Random User Gen", "JSONPlaceholder API", "Weather Forecast API", "Exchange Rate API",
            "CoinMarketCap API", "Binance Live API", "CoinGecko Crypto", "NewsAPI Org", "NASA Astronomy APOD",
            "Country Info API", "Dictionary API", "Translate Google API", "Urban Dictionary", "Pokemon API",
            
            // Extra Tools & Utilities
            "Minecraft Server Ping", "Roblox User Info", "Steam Profile Check", "Discord ID Lookup", "Telegram Chat Tools",
            "WhatsApp Link Gen", "HTML Minifier", "CSS Beautifier", "JS Obfuscator", "SQL Query Builder"
        ];

        const grid = document.getElementById('apiGrid');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function renderCards(filter = "") {
            grid.innerHTML = "";
            const filtered = services.filter(service => service.toLowerCase().includes(filter.toLowerCase()));
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No API services found matching your search.</div>`;
                return;
            }

            filtered.forEach((service, index) => {
                const card = document.createElement('div');
                card.className = `glass-card p-5 rounded-2xl flex flex-col justify-between relative overflow-hidden group`;
                card.id = `card-${index}`;

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-sm border border-indigo-500/20">
                                <i class="fa-solid fa-key"></i>
                            </span>
                            <span class="text-[10px] uppercase tracking-wider px-2 py-1 rounded-md bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20">Active</span>
                        </div>
                        <h3 class="font-semibold text-slate-200 text-base mb-1">${service}</h3>
                        <p class="text-xs text-slate-400 font-mono tracking-wider truncate mb-4" id="key-text-${index}">sk-sachiya-••••••••••••••••</p>
                    </div>
                    <button onclick="generateAndCopy(${index}, '${service}')" 
                        class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold tracking-wide transition-all flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/20 active:scale-95">
                        <i class="fa-solid fa-copy"></i>
                        <span>Generate & Save</span>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // සැබැවින්ම ඩේටාබේස් එකට කනෙක්ට් වී Key එක ලබාගෙන ක්ලිප්බෝඩ් එකට කොපි කිරීම
        async function generateAndCopy(index, serviceName) {
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service_name: serviceName })
                });
                const data = await response.json();

                if (data.success) {
                    const generatedKey = data.api_key;

                    const keyElement = document.getElementById(`key-text-${index}`);
                    keyElement.innerText = generatedKey;

                    // Clipboard එකට කොපි කිරීම
                    await navigator.clipboard.writeText(generatedKey);

                    const cardElement = document.getElementById(`card-${index}`);
                    cardElement.classList.add('animate-minimize');
                    setTimeout(() => cardElement.classList.remove('animate-minimize'), 400);

                    toastMsg.innerText = `${serviceName} Key Saved & Copied!`;
                    toast.classList.remove('translate-y-20', 'opacity-0');
                    setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
                } else {
                    alert("Error generating key from database.");
                }
            } catch (error) {
                console.error("Error generating key:", error);
                alert("Server connection error!");
            }
        }

        searchInput.addEventListener('input', (e) => renderCards(e.target.value));
        renderCards();
    </script>
</body>
</html>
